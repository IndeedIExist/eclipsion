name: No submodule update checker

on:
  pull_request:
    paths:
      - 'RobustToolbox'

permissions:
  contents: read

jobs:
  check_permission:
    name: Check submodule update permission
    runs-on: ubuntu-latest
    steps:
      - name: Require maintainer access
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed(
                `RobustToolbox updates require write access; ${context.actor} has ${data.permission} access.`
              );
            }
