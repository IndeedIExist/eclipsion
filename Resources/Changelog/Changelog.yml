- author: Taleryn
  changes:
    - message: Fixed lathes and microforges ignoring machine part upgrades. Better manipulators speed up printing and better matter bins cut material cost again.
      type: Fix
    - message: Fixed severe server lag when printing large batches in lathes and ore processors.
      type: Fix
    - message: Research servers are now faction-locked. A lathe only draws research from its own faction's server, so dropping a microforge onto someone else's grid no longer grants access to their research.
      type: Tweak
    - message: Machines you construct now belong to your faction rather than to whatever grid they were built on.
      type: Tweak
    - message: Imperial and Union microforges can now only be operated by members of their own faction.
      type: Tweak
    - message: Lathe recipes are now sorted into categories, including new Armor, Clothing, Medical, Ship parts, Power and Implants filters. The microforge's recipe list is browsable instead of one flat alphabetical wall.
      type: Add
  id: 6008
  time: '2026-07-20T00:00:00.0000000+00:00'
  url: null

- author: Taleryn
  changes:
    - message: Reworked the sector stock market. The four faction companies no longer drift at random - their price only moves when something actually happens in the round, such as casualties, a station falling, treasury swings or a won war. Reading the war correctly is now the whole skill of trading them.
      type: Tweak
    - message: Added two neutral companies, the Free Merchants Network and Trans-Cluster Construction, which profit from the chaos the factions generate and give traders somewhere to hedge.
      type: Add
    - message: Share prices and player portfolios now survive round and server restarts. A faction that spent three rounds losing starts the fourth one cheap.
      type: Add
    - message: Added a news tab to the stock market cartridge, explaining why each price moved.
      type: Add
    - message: Companies whose faction is not fielded in the current game mode are delisted for the round. Existing holdings are untouched and still show under your portfolio, they just cannot be traded until that faction is back.
      type: Tweak
    - message: Going to war now seizes your holdings in the enemy faction's company. The forced sale pays the floor price rather than the market price, so being caught holding enemy stock when the shooting starts is a real loss.
      type: Add
    - message: Added a stocks category to the admin economy tab, and a stockmarket console command for listing, freezing, resetting and shocking the market.
      type: Add
    - message: Faction relations now survive round and server restarts, and the faction status widget fills in as soon as you join instead of staying blank until someone works a console.
      type: Fix
    - message: Fixed radio TTS playing a separate overlapping copy of every line, one per nearby listener.
      type: Fix
    - message: TTS now starts at a low volume instead of being silent by default, and no longer errors when a speaker disconnects mid-sentence.
      type: Fix
    - message: Fixed the adminvoice command finding no voices on packaged servers.
      type: Fix
    - message: Shuttle console ID cards are now locked unless the console is in captain access mode, and are ejected when the console is closed.
      type: Fix
    - message: Fixed admin permissions, poker hand names and diplomacy labels breaking on servers whose host machine runs a Turkish system locale.
      type: Fix
    - message: Translated the remaining Russian text in the alert console interface.
      type: Tweak
    - message: Lathes wired to a material silo no longer go blind when the silo loses power. They fall back to whatever is loaded in their own hopper instead of reporting empty while the interface still showed the materials sitting there.
      type: Fix
    - message: A silo losing power no longer drags every connected lathe's materials into itself, where nobody could reach them until power came back.
      type: Fix
    - message: Ore processors now hold onto a run and hand the whole thing over at once when the queue finishes, instead of dropping a sheet at a time. Queue a shift's worth of ore in one go and collect the stacks at the end. Cutting the power hands over whatever it managed to make.
      type: Tweak
    - message: The lathe build queue now lists repeated items as one line with a count, so a few hundred queued sheets no longer bog down the interface.
      type: Tweak
  id: 6009
  time: '2026-07-21T00:00:00.0000000+00:00'
  url: null
- author: Taleryn
  changes:
    - message: The Taypani Freestations Coalition is no longer four squabbling companies. Gorlex, Interdyne, Cyberdawn and the Shipfitters are now one faction with one keyring, under a single Ringleader - the old company names survive only as the names of its departments.
      type: Tweak
    - message: The Coalition now fields a single station, the rebuilt Freeport, in place of Jackal, Hayes, Dochenskaya and the Anvil. It counts for the conquest win condition like every other faction capital.
      type: Tweak
    - message: The Freeport has a command mainframe, a payroll console, a taxation console and a treasury vault - the vault sits in the Ringleader's office and only the Ringleader can open it. Everyone else trips the alarm.
      type: Add
    - message: Tatsumoto finally has the economy it was written for: a Shinohara command mainframe on the bridge, and payroll, taxation and treasury consoles in the executive's office.
      type: Add
    - message: Coalition command staff now carry a single Coalition access elevator covering every department instead of one per company.
      type: Tweak
    - message: Treasury vaults now run on station power. An unpowered vault cannot be robbed, and cutting the power mid-heist kills the siphon - the thieves keep only what has already come out. It locks the owners out too, so it is a real decision.
      type: Tweak
    - message: A faction's own crew can no longer rob its treasury vault. Members without command access are simply turned away instead of tripping the alarm and starting a heist - only outsiders can crack a vault. Membership is read off the person, so a stolen ID card will not pass you off as staff.
      type: Fix
    - message: The Coalition's treasury, taxation and payroll consoles now open for the whole command tier - ringleader, lieutenant, coordinator, foreman and intelligence officer - rather than the ringleader alone.
      type: Fix
    - message: Added recruitment terminals to the Freeport and to Tatsumoto, so both factions can hire on shift like the League and the Mandate already could.
      type: Add
    - message: The recruitment console can no longer demote a faction's own command. It used to recognise them by chat rank alone, which meant Shinohara - who hands out no ranks at all - could reassign its own executives down to shop floor. It now also refuses anyone whose job belongs to the faction but is off the console's hiring list.
      type: Fix
    - message: Deed consoles and shipyard manufactorums have been stripped out of every station. Neither machine has a place in the sector's economy any more, and the Shinohara research node and flatpack that built the manufactorum are gone with them.
      type: Remove
    - message: Shuttle hull plating, electronics and engine components are no longer manufactured. LPCs have been printed straight from ore for a while now, so the intermediate parts were dead weight.
      type: Remove
  id: 6010
  time: '2026-07-21T00:00:00.0000000+00:00'
  url: null
