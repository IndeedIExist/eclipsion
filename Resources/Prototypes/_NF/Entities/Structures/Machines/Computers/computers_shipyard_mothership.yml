# Custom console
- type: entity
  id: BaseMothershipComputer
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, ComputerShipyardCrescent]
  suffix: Mothership
  description: Used on motherships to purchase and sell ships without returning to a station.
  abstract: true
  components:
  - type: ActivatableUI
    key: enum.ShipyardConsoleUiKey.Custom
  - type: UserInterface
    interfaces:
      enum.ShipyardConsoleUiKey.Custom:
        type: ShipyardConsoleBoundUserInterface
  # Mothership/faction shipyards pay from the faction treasury, not the buyer's personal bank.
  - type: ShipyardConsole
    usesFactionTreasury: true
  # Explicitly empty: ComputerShipyardCrescent (our parent) ships a civilian listing, and omitting
  # this field would INHERIT it. Faction consoles override with their own list; empty ones stay empty.
  - type: ShipyardListing
    shuttles: []
