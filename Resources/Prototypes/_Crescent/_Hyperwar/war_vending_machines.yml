# Unionfall conscript vendors. The old credit-based hyperwar war vendors that
# used to live here are gone -- hyperwar now uses the free automated racks in
# hyperwar_armory_vendors.yml.

- type: entity
  parent: [BaseStructureUnanchorable, VendingMachine]
  id: NCWLConscriptWarVendory
  name: NCWL conscript war vendor
  description: You're getting the bottom of the barrel. Good luck.
  components:
  - type: VendingMachine
    pack: NCWLConscriptWarInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: Advertise
    pack: WarVendAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Speech
  - type: Sprite
    sprite: _Crescent/Structures/armory.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: MarketModifier
    mod: 0.2

