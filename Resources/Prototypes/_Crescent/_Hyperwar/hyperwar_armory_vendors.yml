# Hyperwar automated armory vendors.
# Free (no points) CMAutomatedVendor racks that hand out the full WEAPON + ARMOR
# arsenal from each faction's tech tree, so no research is needed during hyperwar.
# NCWL pulls from the Communard tree, DSM pulls from the Imperial tree.

- type: entity
  parent: ColMarTechBase
  id: HyperwarNCWLArmoryVendor
  name: automated NCWL war armory
  description: An automated rack wired straight into the League's wartime stockpile. Everything the arsenal can research, no tithe required.
  components:
  - type: AccessReader
    access:
    - [ "NCWLGeneral" ]
  - type: Sprite
    sprite: _Crescent/Structures/syndicatearmory.rsi
  - type: CMAutomatedVendor
    jobs:
    - PartisanNCWL
    sections:
    - name: Primary Weapons
      entries:
      - id: WeaponRifleFAL
        name: MK-2 Falin 5.56x45mm
        recommended: true
      - id: WeaponRifleNCWLBatanya
        name: Batanya battle rifle
      - id: WeaponSubMachineGunNCWLWatchdog
        name: DS1 Watchdog 9x19mm
      - id: WeaponSubMachineGunBloodhound
        name: Bloodhound SMG
      - id: WeaponSubMachineGunMilitant
        name: Militant SMG
      - id: WeaponShotgunProletar
        name: Toz-97 Proletariat 12 gauge
      - id: WeaponShotgunDoubleBarreledNCWL
        name: double-barreled shotgun
      - id: WeaponShotgunToz123
        name: Toz-123 shotgun
      - id: WeaponLightMachineGunConscript
        name: Conscript LMG
      - id: WeaponSniperNCWLNovomosin
        name: Novomosin sniper rifle
      - id: WeaponSniperMolot
        name: Molot sniper rifle
      - id: WeaponLauncherGM94
        name: GM-94 grenade launcher
    - name: Sidearms
      entries:
      - id: WeaponPistolComrade
        name: Comrade pistol
      - id: WeaponPistolT91
        name: T91 pistol
      - id: WeaponRevolverPython
        name: Python revolver
    - name: Melee
      entries:
      - id: NCWLLugBaton
        name: lug baton
      - id: NCWLKukri
        name: vibro kukri
    - name: Armor
      entries:
      - id: NCWLRiotShield
        name: riot shield
      - id: RiotBulletShield
        name: bullet shield
      - id: ClothingOuterHardsuitNCWLInfantry
        name: infantry hardsuit
      - id: ClothingOuterHardsuitNCWLPetya
        name: Petya heavy hardsuit
      - id: ClothingOuterHardsuitNCWLJuggernaut
        name: Commienaut juggernaut hardsuit
      - id: ClothingOuterHardsuitNCWLEngi
        name: engineer hardsuit
      - id: ClothingOuterHardsuitNCWLMedi
        name: medic hardsuit
    - name: Ammunition
      entries:
      - id: MagazineLightRifle
        name: 30-round magazine (5.56x45mm)
      - id: MagazinePistolSubMachineGun
        name: 35-round SMG magazine (9x19mm)
      - id: MagazineShotgun
        name: 10-round magazine (12 gauge)
      - id: MagazinePistol
        name: pistol magazine
      - id: MagazineRifle
        name: rifle magazine
    - name: Utilities
      entries:
      - id: JetpackCaptainFilled
      - id: HandHeldMassScannerEE
      - id: BoxMRE
    - name: Medical
      entries:
      - id: MedkitCombatFilled
      - id: Medipen
      - id: EmergencyMedipen
      - id: CombatMedipen
      - id: SpaceMedipen
      - id: AntiPoisonMedipen
      - id: ChemicalMedipen
      - id: PainMedipen
      - id: SurvivalMedipen
      - id: BruteAutoInjector
      - id: BurnAutoInjector
      - id: AirlossAutoInjector

