# Automated ship ammunition depot (replaces the old credit-based ShipWarVendory).
# Free, unlimited, open to everyone (no AccessReader) so any ship crew can restock.
# Entry names are omitted so each shows its own prototype name.
- type: entity
  parent: ColMarTechBase
  id: HyperwarShipAmmoVendor
  name: automated ship ordnance depot
  description: An automated depot wired into the fleet magazines. All ship-gun ordnance, free to restock.
  components:
  - type: Sprite
    sprite: _Crescent/Structures/syndicatearmory.rsi
  - type: CMAutomatedVendor
    sections:
    - name: Autocannon Drums
