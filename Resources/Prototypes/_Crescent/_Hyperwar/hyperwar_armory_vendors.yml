# Automated ship LPC (fabprint disk) vendors, one per faction.
# Every regular NCWL / DSM ship LPC, free. Unionfall event ships are NOT included.
# Redeem the disk at a shipyard console to spawn the ship.
- type: entity
  parent: ColMarTechBase
  id: HyperwarNCWLShipVendor
  name: automated NCWL LPC printer
  description: An automated fabprint press stocked with every League ship pattern. Redeem a disk at a shipyard console.
  components:
  - type: AccessReader
