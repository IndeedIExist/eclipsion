# HYPERWAR: NCWL vs DSM clashing over the central asteroid belt.
# Uses the special RatWorldHyperwar worldgen (central belt kept, surrounding ring removed).
- type: gamePreset
  id: RatHyperwar
  alias:
  - rathyperwar
  - hyperwar
  name: Hyperwar | NCWL vs DSM
  showInVote: true
  description: NCWL and DSM wage a brutal hyperwar over the heart of Taypan. Last 2-4 hours.
  rules:
  - RatHyperwar
  - HullrotEventScheduler

- type: entity
  id: RatHyperwar
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GamemodeRespawnTime
    respawnTimeMinutes: 10
  - type: AdventureRule
    worldgenConfig: RatWorldHyperwar
    gameMapsByID:
      PortBalreska:
        gameMapID: PortBalreska
        posX: 0
        posY: -4500
        IFFColor: Orange
        IFFFaction: NCWL
      AuroraImperialis:
        gameMapID: AuroraImperialis
        posX: 0
        posY: 4500
        IFFColor: "#C677A5"
        IFFFaction: DSM

- type: gamePreset
  id: Planetfall
  alias:
  - planetfall
  name: Planetfall
  showInVote: true
  description: Something isn't right in olywier's planet...
  roundStartMessage: "All personnel stationed on Olywier are to maintain heightened alert. Unrest has been reported across the outer settlements. Dominion authority must be upheld at all costs. Insurgent activity is suspected. Secure all critical infrastructure and await further orders."
  roundStartSender: "Castle Garrison"
  availableJobs:
  - planetfall_worker
  - planetfall_partisan
  - planetfall_mvdofficer
  - planetfall_mvdgrunt
  - planetfall_kapitan
  - planetfall_doctor
  - planetfall_courtier
  - planetfall_advocatus
  - planetfall_governor
  - planetfall_freeholder
  - planetfall_levyman
  - planetfall_surgeon
  rules:
  - Planetfall

- type: entity
  id: Planetfall
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GamemodeRespawnTime
    respawnTimeMinutes: 5
  - type: AdventureRule
    gameMapsByID:
      PlanetfallMap:
        gameMapID: PlanetfallMap
        posX: 0
        posY: 0
