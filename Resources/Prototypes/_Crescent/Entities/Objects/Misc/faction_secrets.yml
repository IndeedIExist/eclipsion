# The DSM and NCWL crown-jewel intelligence folders — steal targets for the opposing faction's round-end directive.
#
# Each faction's directive is satisfied by EITHER the enemy leader's ID card OR this folder, so there are two ways
# in: mug the leader, or crack the archive. These are meant to be mapped into their owner's leadership area
# (Governor's chambers / Commandant's offices), not to spawn loose.

- type: entity
  parent: BoxFolderBase
  id: FolderImperialSecrets
  name: Ancient Imperial Secrets
  suffix: DSM Objective
  description: A folder containing ancient Imperial blueprints, strategic documents, engineering schematics, military plans, and other confidential records preserved by the Empire. The information inside is considered invaluable and could significantly strengthen any faction that obtains it.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: folder-colormap
      color: "#b38e3c"
    - state: folder-base
  - type: Tag
    tags:
    - Folder
    - ImperialSecretsFolder
  - type: StaticPrice
    price: 5000
  - type: CargoSellBlacklist

- type: entity
  parent: BoxFolderBase
  id: FolderLeaguePlans
  name: League Plans
  suffix: NCWL Objective
  description: A folder containing strategic plans, engineering schematics, logistical reports, and tactical doctrines created by the League's finest workers, engineers, and military planners. It represents years of collective knowledge and is one of the League's most closely guarded assets.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: folder-colormap
      color: "#a02c2c"
    - state: folder-base
  - type: Tag
    tags:
    - Folder
    - LeaguePlansFolder
  - type: StaticPrice
    price: 5000
  - type: CargoSellBlacklist
