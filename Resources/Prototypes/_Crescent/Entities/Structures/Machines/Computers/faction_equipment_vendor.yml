    - name: Backpacks
      takeAll: NCWLBack
      entries:
      - id: ClothingBackpackNCWL
      - id: ClothingBackpackSatchelNCWL
      - id: ClothingBackpackDuffelNCWL
    - name: Uniforms
      takeAll: NCWLUniform
      entries:
