      - id: ClothingUniformJumpsuitNCWLMedic
      - id: ClothingUniformJumpsuitNCWLArtificer
      - id: ClothingUniformJumpsuitNCWLTelnikSleeved
      - id: ClothingUniformJumpsuitNCWLTelnikSleeveless
      - id: ClothingUniformJumpsuitNCWLTrainee
