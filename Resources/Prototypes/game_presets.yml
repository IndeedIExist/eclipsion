# Crescent's playable gamemodes live in _Crescent/GameRules/hullrotGamemodes.yml.
# Everything below is upstream and has showInVote: false — admin/fallback use only.
#
# Extended and Sandbox are load-bearing, do not remove them:
#   Extended -> game.fallbackpreset  (CCVars.Game.cs), used when a preset fails to start.
#   Sandbox  -> hardcoded "sandbox"  (GameTicker.InitializeGamePreset) when the lobby is disabled.
# Traitor / Zombie / Changeling are kept because secret_weights.yml picks from them.

- type: gamePreset
  id: Extended
  alias:
  - extended
  - shittersafari
  name: extended-title
  showInVote: false #2boring2vote # DeltaV - I'd like to disagree, used for periapsis.
  description: extended-description
  rules:
  - BasicStationEventScheduler
  - BasicRoundstartVariation
  - SubGamemodesRule
  - LavalandStormScheduler # Lavaland Change

- type: gamePreset
  id: Secret
  alias:
    - secret
    - sekrit
  name: secret-title
  showInVote: false
  description: secret-description
  rules:
    - Secret
    - LavalandStormScheduler # Lavaland Change

- type: gamePreset
  id: Sandbox
  alias:
    - sandbox
  name: sandbox-title
  description: sandbox-description
  showInVote: false # Not suitable for use without admin intervention, since entity spamming can quickly crash a server
  maxPlayers: 5
  rules:
    - Sandbox
    - LavalandStormScheduler # Lavaland Change

- type: gamePreset
  id: Traitor
  alias:
    - traitor
  name: traitor-title
  description: traitor-description
  showInVote: false
  rules:
    - Traitor
    - SubGamemodesRule
    - BasicStationEventScheduler
    - BasicRoundstartVariation
    - LavalandStormScheduler # Lavaland Change

- type: gamePreset
  id: Zombie
  alias:
  - zombie
  - zombies
  - Zombies
  - zz14
  - zomber
  name: zombie-title
  description: zombie-description
  showInVote: false
  rules:
  - Zombie
  - BasicStationEventScheduler
  - BasicRoundstartVariation
  - LavalandStormScheduler # Lavaland Change

- type: gamePreset
  id: Changeling
  alias:
  - Changeling
  - Changelings
  - Ling
  - Lings
  name: changeling-gamemode-title
  description: changeling-gamemode-description
  showInVote: false
  rules:
  - Changeling
  - SubGamemodesRule
  - BasicStationEventScheduler
  - BasicRoundstartVariation
  - LavalandStormScheduler # Lavaland Change
