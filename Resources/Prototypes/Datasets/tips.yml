- type: dataset
  id: Tips
  values:
  - "Izdom, originally a failed supersoldier cloning project, is now used by modern Taypani as a grave insult to one's competence and coherence. The usage of the word is scarce, and often leads to violent killings."
  - "Sector Crescent is made up of six systems, and is divvied up into the Core and Outer Rim districts in terms of governance. The systems Chengridz, Porodschok and Malpais making up the NCWL-controlled Core, while Taypan and Domain make up the contested Outer Rim."
  - "Hullrot refers to an entropic decay of a vessel's vibroplasteel hull alloy, most commonly seen in Hadal Deepdiver vessels as a result of exotic particles from the Fog acting as rapid oxidizers against the metal content of a vessel's outer plating."
  - "Imperial society is driven by religious fervor in the form of canonized Saints. Those recognized by the Saintsworn faith as having lived remarkable and faithful lives are often post-humously canonized in death."
  - "The Imperial Charter of Scribes is the arm of House Vogsburg tasked with developing new technologies for their liege in both Imperial military and civilian applications."
  - "Lepidopods and arachnopods, despite being different races, are collectively called Atyrians by the Imperial Supercluster and the Crescent."
  - "In 101 BBSC (Before Bluespace Collapse), the Crescent United Worker’s Front is formed to demand humane treatment for plasma extractors laboring in servitude to the Divine Sol Mandate."
  - "The Battle for Chengridz (81-78 BBSC) culminates in the NCWL seizing the sector’s largest stores of plasma as well as the warp-gates leading in and out of the system."
  - "Trade goods can be purchased at a station’s Dispensary, Commissary or manufactured using Commodity Fabricators and then sold for a profit at other stations."
  - "Trade goods are delivered to a Turn-in Chute in exchange for a credit deed that can be redeemed at a Deed Console."
  - "Each station has a unique list of trade goods that can be purchased or produced from materials."
  - "The Taypan system once had three planets. The Authoritat's 43rd Battlegroup arrived. Today it only has two."
  - "A Mass Scanner and GPS is always useful in Taypan. Veteran Spacers vouchsafe that they keep the Fog away."
  - "Love blooms."
  - "Kane whispers in the dreams of some within Taypan. For a select few, he issues orders."
  - "Within each flesh beast melded by the Hadal, there is a microchip. Cut them out."
  - "The chances of being murdered by your coworkers are low, but never zero."
  - "Shinohara Heavy Industries operates a branch within Taypan at the Tatsumoto Shipyard. Their relatively up-to-date technology chips produce everything the contested System desires, for a price."
  - "The New Crescent Syndicate of Privateers (NCSP) quickly collapsed with the disappearance of Sir William 'Pincer' Moore, the closest recent successor is the Taypan Free Stations Coalition (TFSC). Which has splintered apart even further."
  - "The Domain, once the only uncontested Divine Sol Mandate system within Sector Crescent is now under occupation of the Authoritat's 43rd Battlegroup. Few refugees consider to escape to Taypan, knowing conditions to be grimly worse."
  - "The 6th St. Romaine's Militia is still spoken of by hushed voices. Speaking their name is said to draw them near, often used as a phenomenal curse against Atyrians."
  - "The Hadal Tide periodically scourges the entirety Taypan with energies unknown to mankind. It's currents are unpredictable and malevolent. Only thick layers of reinforced plastitanium hull are proof against it. Well. Most of it."
  - "In the psychic world, promises and belief holds power. With a sufficient amount of strong psychic imprint from a sufficient amount of sapients, manifestations can be made reality through sheer force of will, and pacts made with these apparitions are often upheld to the last detail."
  - "The New Liberation Front are a group formed of NCWL dissidents disgruntled by power struggles and coups. Operating out of converted civilian craft they have ambushed many Homeguard vessels during inspections."
  - "Reports show long-term EVA in Taypan can lead to a multitude of medical conditions, including but not limited to, rot contamination in lungs, uncontrollable bleeding, and death."
  - "After the breaking up of Kal Surezai by the 43rd Battlegroup, a number of Knights and Dames lost contact with their lieges. These Remnants continue serving their oaths or desires within the 'hedges' of Taypan, living on jerry rigged supplies and equipment."
  - "The Divine Sol Mandate's House of Questions has a policy of recording all psionics within Mandate territories."
  - "Nanotrasen brand Cigarettes are rumoured to be made from a mythical elixir of life, kept solely in-house and within executives hands as boons to employees. Nanotrasen fog wrecks are the only known holders of these exquisite packs of ten."
  - "Pang Tai Arms strategy to counter Shinohara's great quantity with quality, taking stable experimental weapons designs to market has made a dangerous rival to Shinohara and its unmarked Liquidators."
  - "Pax America lives on but written small in the New American Protectorate (NAP), secured in New Washington, far from Sector Crescent. Through suave diplomacy and a fleet capable of punching above its weight, its citizens has retained its somewhat peace through the ages of Strife and Broken Chains."
  - "Sol, the highest throne of Mandate power was abruptly up-turned when the Coup restructured the the core systems into the Central Solarian Authoritat. Complacent and titled noble necks were bent back from the knives of their ambitious lieutenants and the invulnerable Kaiser was revealed as a human corpse."
  - "The Atyrian diaspora spread across the imperial sphere until they were collected, by the Kaiser's command, into the Atyrian Preserve."
  - "The Officers Coup in Sol spun the greater Divine Sol Mandate into a state of confusion and civil war, Kaiserin Tadia Guies II has the systems about Kyotr's Rest back within the Imperial grasp. Too far away to aid Taypan but hope can shine a miraculous distance."
  - "The NCWL's state sponsored language evolved from early dockworkers' canto, bridging the gap between species, profession and culture for the sake of industrial quota."
  - "Taypan and the Sector Crescent has been cut off from the Imperial Supercluster until very recently. The several hundred years of isolation has changed everything and yet nothing. Sector Crescent remains a trap to all who enter."
